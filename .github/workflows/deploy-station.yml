name: deploy-station

# Install an already published release on the station through Home Assistant.
#
# Nothing is built here: `build.yml` publishes the release on a `v*` tag and
# then calls this workflow. The `Station` Environment needs a required reviewer,
# so the install only runs after a human approved that run in the GitHub UI.
# `workflow_dispatch` re-runs an install for a release that already exists.
#
# Secrets (Environment `Station`): VPN_SERVER, VPN_CERT_P12_B64,
# VPN_CERT_PASSWORD, OPENBAO_ADDR, optional OPENBAO_ROLE (default
# `deploy-station`). Everything needed *after* the VPN is up (HA URL, token,
# entity) lives in OpenBao `secret/data/ci/deploy-station` and is read by
# `hashicorp/vault-action` over GitHub OIDC; every value is masked by the action
# and never printed. The role's short token TTL is the revocation limit.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to install (for example v0.5.1001)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to install (must have a published GitHub release)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: station-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A human approves the deployment here; this is the only gate before the
    # station is touched. The tag rule `v*` belongs to the Environment.
    environment: Station
    permissions:
      contents: read
      id-token: write # OpenBao auth/github OIDC (audience = OPENBAO_ADDR)
    env:
      TAG: ${{ inputs.tag }}
      VPN_SERVER: ${{ secrets.VPN_SERVER }}
      IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
      IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      OPENBAO_ROLE: ${{ secrets.OPENBAO_ROLE || 'deploy-station' }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          # The station's updater only reaches releases/latest, so the release
          # must already exist and be a stable one.
          if ! release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease 2>/dev/null); then
            echo "::error::no GitHub release for $TAG"
            exit 1
          fi
          verdict=$(RELEASE="$release" TAG="$TAG" python3 - <<'PY'
          import json, os
          release = json.loads(os.environ["RELEASE"])
          tag = os.environ["TAG"]
          if release.get("isDraft"):
              print(f"release {tag} is a draft")
          elif release.get("isPrerelease"):
              print(f"release {tag} is a prerelease")
          else:
              print("")
          PY
          )
          if [[ -n "$verdict" ]]; then
            echo "::error::$verdict"
            exit 1
          fi
          echo "release $TAG is published and stable"

      - name: Install openconnect
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends openconnect vpnc-scripts

      - name: Materialise VPN credentials
        run: |
          set +x
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/ci"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          chmod 600 "$CI_DIR"/*
          echo "VPN credentials prepared"

      - name: Connect VPN (group ci)
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          test -n "$OPENBAO_ADDR"
          # shellcheck disable=SC2024 # the log is user-writable; only openconnect is root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          # The ci group routes only the K3s node; OpenBao health on 443 is the
          # first service this job needs.
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$OPENBAO_ADDR/v1/sys/health" || true)
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "OpenBao reachable over the VPN"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBao is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      # GitHub OIDC -> OpenBao (auth/github, JWT audience = OPENBAO_ADDR). The
      # action masks every line of every value and publishes them as step
      # outputs; the deploy step reads them from `env`, never from argv.
      - name: Read deploy secrets from OpenBao
        id: openbao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.OPENBAO_ADDR }}
          method: jwt
          path: github
          role: ${{ env.OPENBAO_ROLE }}
          jwtGithubAudience: ${{ env.OPENBAO_ADDR }}
          exportEnv: false
          secrets: |
            secret/data/ci/deploy-station ha_url | HA_URL ;
            secret/data/ci/deploy-station ha_token | HA_TOKEN ;
            secret/data/ci/deploy-station entity_id | ENTITY_ID

      - name: Install ${{ inputs.tag }} through Home Assistant
        env:
          HA_URL: ${{ steps.openbao.outputs.HA_URL }}
          HA_TOKEN: ${{ steps.openbao.outputs.HA_TOKEN }}
          ENTITY_ID: ${{ steps.openbao.outputs.ENTITY_ID }}
          DEPLOY_LOG: ${{ runner.temp }}/ci/deploy.log
        run: |
          set +e
          set -o pipefail
          if [[ -z "${HA_URL:-}" || -z "${HA_TOKEN:-}" || -z "${ENTITY_ID:-}" ]]; then
            echo "OpenBao returned an empty deploy value" >&2
            exit 1
          fi
          python3 tools/ha_firmware_deploy.py --tag "$TAG" 2>&1 | tee "$DEPLOY_LOG"
          status=$?
          {
            echo "### Station deploy"
            echo
            echo "- tag: \`$TAG\`"
            if grep -q 'already installed' "$DEPLOY_LOG"; then
              echo "- result: already installed"
            else
              grep -E 'done: before=|^error:' "$DEPLOY_LOG" | sed 's/^/- /' || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Disconnect VPN and remove temporary files
        if: always()
        run: |
          set +e
          CI_DIR="$RUNNER_TEMP/ci"
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -rf "$CI_DIR" "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "temporary deploy files removed"
